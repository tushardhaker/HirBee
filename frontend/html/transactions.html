<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transaction History | Local-Lance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --bg-lavender: #F6EEFF; 
            --primary-purple: #8C4EC9; 
            --secondary-lilac: #DFC6F9;
            --text-dark: #2D1B41;
        }

        body { 
            background-color: var(--bg-lavender); 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            color: var(--text-dark); 
        }

        /* Navbar/Header Styling */
        .header-section {
            background: white;
            padding: 1.5rem 0;
            border-bottom: 1px solid rgba(140, 78, 201, 0.2);
            margin-bottom: 2rem;
        }

        .table-card { 
            border-radius: 20px; 
            border: none; 
            background: white; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.05); 
            overflow: hidden; 
        }

        thead { 
            background: var(--primary-purple); 
            color: white; 
        }
        th { 
            font-weight: 600; 
            padding: 1.2rem !important; 
        }
        td { 
            padding: 1.2rem !important; 
        }

        /* Status Badges */
        .badge-success-custom { 
            background: rgba(140, 78, 201, 0.12); 
            color: var(--primary-purple); 
            border: 1px solid rgba(140, 78, 201, 0.3); 
        }
        .badge-debit { 
            background: #FFF1F2; 
            color: #F43F5E; 
        }
        .badge-credit { 
            background: rgba(140, 78, 201, 0.1); 
            color: var(--primary-purple); 
        }

        /* Buttons & links */
        .btn-primary {
            background: var(--primary-purple) !important;
            border-color: var(--primary-purple) !important;
        }
        .btn-primary:hover {
            background: #7a3fb3 !important;
            border-color: #7a3fb3 !important;
        }

        /* Export Button Styling */
        .btn-export-outline {
            border: 2px solid var(--primary-purple);
            color: var(--primary-purple);
            background: transparent;
            transition: all 0.3s ease;
        }
        .btn-export-outline:hover {
            background: var(--primary-purple);
            color: white;
        }

        .text-primary, .spinner-border {
            color: var(--primary-purple) !important;
        }

        .mobile-label {
            font-weight: bold; 
            color: var(--primary-purple); 
            font-size: 0.75rem; 
            text-transform: uppercase; 
            display: block;
        }

        /* --- MOBILE RESPONSIVE TABLE FIX --- */
        @media (max-width: 768px) {
            .header-section { text-align: center; }
            .header-section .d-flex { flex-direction: column; gap: 1rem; }
            
            /* Hide Table Header on Mobile */
            thead { display: none; }
            
            /* Force table to behave like cards */
            table, tbody, tr, td { display: block; width: 100%; }
            
            tr { 
                margin-bottom: 1rem; 
                border-bottom: 1px solid #eee; 
                padding: 1rem;
                position: relative;
                background: white;
                border-radius: 12px;
            }

            td { 
                border: none !important; 
                padding: 0.5rem 0 !important; 
                text-align: left;
            }

            .amount-cell { 
                position: absolute; 
                top: 1rem; 
                right: 1rem; 
                text-align: right; 
                width: auto; 
            }
        }
    </style>
</head>
<body>

    <header class="header-section shadow-sm">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center">
                <div>
                    <h3 class="fw-bold mb-0 text-primary">
                        <i class="bi bi-receipt-cutoff me-2"></i>Transaction History
                    </h3>
                    <p class="text-muted small mb-0">Detailed log of all financial movements</p>
                </div>
                <div class="d-flex gap-2">
                    <button onclick="exportToCSV()" class="btn btn-export-outline rounded-pill px-4 fw-bold">
                        <i class="bi bi-download me-2"></i>Export
                    </button>
                    <a id="backBtn" href="#" class="btn btn-primary rounded-pill px-4 fw-bold shadow-sm">
                        <i class="bi bi-arrow-left me-2"></i>Back
                    </a>
                </div>
            </div>
        </div>
    </header>

    <div class="container mb-5">
        <div class="card table-card">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0" id="transactionTable">
                    <thead>
                        <tr>
                            <th class="ps-4">Date & Time</th>
                            <th>Description</th>
                            <th>Type</th>
                            <th>Amount</th>
                            <th class="text-center">Status</th>
                        </tr>
                    </thead>
                    <tbody id="txBody">
                        <tr>
                            <td colspan="5" class="text-center py-5">
                                <div class="spinner-border text-primary" role="status"></div>
                                <p class="mt-2 text-muted">Loading transactions...</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const email = localStorage.getItem('userEmail');
        const role = localStorage.getItem('userRole');
        let currentTransactions = []; // Store loaded data for export

        function setupBackButton() {
            const btn = document.getElementById('backBtn');
            btn.href = (role === 'FREELANCER') ? 'earning.html' : 'wallet.html';
        }

        async function loadHistory() {
            if (!email) { window.location.href = "login.html"; return; }
            
            try {
                const res = await fetch(`https://hirbee-1.onrender.com/api/wallet/transactions?email=${email}`);
                if(!res.ok) throw new Error("Failed to fetch");
                
                const txs = await res.json();
                txs.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
                currentTransactions = txs; // Save to global variable for export

                const body = document.getElementById('txBody');
                if(txs.length === 0) {
                    body.innerHTML = '<tr><td colspan="5" class="text-center py-5"><i class="bi bi-cloud-slash fs-1 text-muted"></i><p class="mt-2 text-muted">No transactions found</p></td></tr>';
                    return;
                }

                body.innerHTML = txs.map(t => {
                    const isSent = t.senderEmail === email;
                    const dateObj = new Date(t.timestamp);
                    const date = dateObj.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
                    const time = dateObj.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                    
                    return `
                        <tr>
                            <td class="ps-4">
                                <span class="mobile-label">Date & Time</span>
                                <b>${date}</b><br><small class="text-muted">${time}</small>
                            </td>
                            <td>
                                <span class="mobile-label">Description</span>
                                <div class="fw-bold">${isSent ? 'Sent to' : 'Received from'}</div>
                                <div class="small text-muted text-truncate" style="max-width: 200px;">${isSent ? t.receiverEmail : t.senderEmail}</div>
                            </td>
                            <td>
                                <span class="mobile-label">Type</span>
                                <span class="badge rounded-pill ${isSent ? 'badge-debit' : 'badge-credit'}">
                                    <i class="bi ${isSent ? 'bi-arrow-up-right' : 'bi-arrow-down-left'} me-1"></i>
                                    ${isSent ? 'Debit' : 'Credit'}
                                </span>
                            </td>
                            <td class="amount-cell">
                                <span class="mobile-label">Amount</span>
                                <h6 class="fw-bold mb-0 ${isSent ? 'text-danger' : 'text-success'}">
                                    ${isSent ? '-' : '+'} ₹${t.amount.toLocaleString('en-IN', {minimumFractionDigits: 2})}
                                </h6>
                            </td>
                            <td class="text-md-center">
                                <span class="mobile-label">Status</span>
                                <span class="badge badge-success-custom rounded-pill">Completed</span>
                            </td>
                        </tr>`;
                }).join('');
            } catch (e) { 
                document.getElementById('txBody').innerHTML = '<tr><td colspan="5" class="text-center text-danger py-5">Error loading history. Please try again.</td></tr>';
            }
        }

        // --- EXPORT TO CSV FUNCTION ---
        function exportToCSV() {
            if (currentTransactions.length === 0) {
                alert("No transactions available to export.");
                return;
            }

            // Define CSV headers
            const headers = ["Date", "Time", "Type", "Counterparty", "Amount (INR)", "Status"];
            
            // Map transaction data to rows
            const rows = currentTransactions.map(t => {
                const isSent = t.senderEmail === email;
                const dateObj = new Date(t.timestamp);
                const date = dateObj.toLocaleDateString('en-IN');
                const time = dateObj.toLocaleTimeString();
                const type = isSent ? "Debit" : "Credit";
                const counterparty = isSent ? t.receiverEmail : t.senderEmail;
                const amount = isSent ? `-${t.amount}` : t.amount;
                
                return [date, time, type, counterparty, amount, "Completed"];
            });

            // Combine into CSV string
            let csvContent = "data:text/csv;charset=utf-8," 
                + headers.join(",") + "\n" 
                + rows.map(e => e.join(",")).join("\n");

            // Create download link and trigger it
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `Transactions_${email}_${new Date().toLocaleDateString()}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        setupBackButton();
        loadHistory();
    </script>
</body>
</html>
