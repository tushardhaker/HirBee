<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Freelancers | HirBee</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <style>
        body {
            background: #F6EEFF;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .freelancer-card {
            background: white;
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            transition: 0.3s;
            border: 1px solid #DFC6F9;
        }

        .freelancer-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
        }

        .profile-img {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
        }
    </style>
</head>
<body>

<div class="container py-5">

    <h2 class="fw-bold text-center mb-4">Find Freelancers</h2>

    <input type="text" id="searchInput" class="form-control rounded-pill mb-4"
           placeholder="Search freelancers..." onkeyup="filterFreelancers()">

    <div class="row g-3" id="freelancerGrid"></div>

    <div id="noResult" class="text-center py-5 d-none">
        <h5>No freelancers found</h5>
    </div>

</div>

<script>
    let allFreelancers = [];

    async function loadFreelancers() {
        try {
            const res = await fetch('https://hirbee-1.onrender.com/api/auth/users-by-role?role=FREELANCER');
            allFreelancers = await res.json();
            renderFreelancers(allFreelancers);
        } catch (err) {
            console.error(err);
        }
    }

    function renderFreelancers(list) {
        const grid = document.getElementById("freelancerGrid");
        const noResult = document.getElementById("noResult");

        grid.innerHTML = "";

        if (!list.length) {
            noResult.classList.remove("d-none");
            return;
        }

        noResult.classList.add("d-none");

        list.forEach(user => {
            grid.innerHTML += `
                <div class="col-md-3">
                    <div class="freelancer-card">
                        <img src="${user.profileImage || 'https://via.placeholder.com/150'}" class="profile-img mb-2">
                        <h6 class="fw-bold">${user.fullName}</h6>
                        <small class="text-muted">${user.location || 'No location'}</small>
                    </div>
                </div>`;
        });
    }

    function filterFreelancers() {
        const term = document.getElementById("searchInput").value.toLowerCase();

        const filtered = allFreelancers.filter(user =>
            user.fullName.toLowerCase().includes(term) ||
            user.email.toLowerCase().includes(term)
        );

        renderFreelancers(filtered);
    }

    window.onload = loadFreelancers;
</script>

</body>
    <script src="../script/session.js"></script>

</html>
