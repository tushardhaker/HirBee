<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Active Jobs Monitoring | Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        .job-details-text {
            max-width: 250px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .badge-mode { font-size: 0.75rem; text-transform: uppercase; }
    </style>
</head>
<body class="bg-light p-4">

    <div class="container-fluid">
        <div class="card border-0 shadow-sm p-4 rounded-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h5 class="fw-bold mb-0 text-dark">
                    <i class="bi bi-briefcase-fill me-2 text-primary"></i>Platform Vacancy Data
                </h5>
                <button class="btn btn-sm btn-outline-primary" onclick="fetchJobs()">
                    <i class="bi bi-arrow-clockwise"></i> Refresh Jobs
                </button>
            </div>

            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light border-bottom">
                        <tr class="small fw-bold text-secondary">
                            <th>ID</th>
                            <th>CLIENT EMAIL</th>
                            <th>JOB DETAILS</th>
                            <th>BUDGET</th>
                            <th>MODE & LOCATION</th>
                            <th>POSTED DATE</th>
                            <th class="text-center">ACTION</th>
                        </tr>
                    </thead>
                    <tbody id="jobListBody">
                        <tr>
                            <td colspan="7" class="text-center py-5 text-muted">
                                Loading vacancy data from database...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
    // Aapke backend ka exact endpoint
    const API_URL = "https://hirbee-1.onrender.com/api/admin/jobs";

    async function fetchJobs() {
        try {
            const response = await fetch(API_URL);
            if (!response.ok) throw new Error("Backend not responding");

            const jobs = await response.json();
            const tbody = document.getElementById('jobListBody');
            
            if (jobs.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="text-center py-4">No active vacancies found.</td></tr>';
                return;
            }

            tbody.innerHTML = jobs.map(job => {
                const date = job.createdAt ? new Date(job.createdAt).toLocaleDateString() : 'N/A';
                
                // Yahan backticks (`) ka sahi use karein
                return `
                <tr>
                    <td class="text-muted small">#${job.id}</td>
                    <td class="fw-bold text-dark">${job.clientEmail}</td>
                    <td>
                        <div class="job-details-text text-muted small" title="${job.details}">
                            ${job.details}
                        </div>
                    </td>
                    <td class="fw-bold text-success">₹${job.budget}</td>
                    <td>
                        <span class="badge bg-info-subtle text-info">${job.mode}</span>
                        <div class="small text-muted mt-1"><i class="bi bi-geo-alt"></i> ${job.location || 'Remote'}</div>
                    </td>
                    <td class="small">${date}</td>
                    <td class="text-center">
                        <button class="btn btn-sm btn-outline-danger" onclick="deleteJob(${job.id})">
                            <i class="bi bi-trash"></i>
                        </button>
                    </td>
                </tr>`;
            }).join('');

        } catch (error) {
            console.error("Error fetching jobs:", error);
            document.getElementById('jobListBody').innerHTML = `
                <tr>
                    <td colspan="7" class="text-center py-4 text-danger">
                        Error: Data fetch failed. Check if Backend is running at 8080.
                    </td>
                </tr>`;
        }
    }

    // Is function mein backslash (\) ki galti thi, use maine yahan theek kar diya hai
    async function deleteJob(id) {
        if (confirm("Are you sure you want to remove this vacancy?")) {
            try {
                // Sahi format: backticks ke saath ${id}
                const res = await fetch(`https://hirbee-1.onrender.com/api/admin/jobs/${id}`, { 
                    method: 'DELETE' 
                });
                
                if (res.ok) {
                    alert("Job deleted successfully");
                    fetchJobs();
                } else {
                    alert("Failed to delete job.");
                }
            } catch (err) { 
                console.error(err); 
            }
        }
    }

    window.onload = fetchJobs;
</script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
