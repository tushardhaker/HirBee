<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration | HirBee</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="/css/signup.css">
    <link rel="stylesheet" href="https://unpkg.com/intro.js/minified/introjs.min.css">
    <style>
        /* Custom Tutorial Styling */
        .introjs-tooltip { border-radius: 15px; font-family: 'Plus Jakarta Sans', sans-serif; padding: 20px; }
        .introjs-nextbutton { background: #8e44ad !important; text-shadow: none !important; border: none !important; border-radius: 20px !important; color: white !important; }
        .introjs-prevbutton { border-radius: 20px !important; }
        .introjs-skipbutton { color: #999 !important; font-weight: bold; }
        .introjs-bullets ul li a.active { background: #8e44ad !important; }
    </style>
</head>
<body>

    <div id="successOverlay" class="success-overlay">
        <div class="success-content text-center">
            <div class="success-icon-box mb-4">
                <i class="bi bi-check-circle-fill"></i>
            </div>
            <h2 class="fw-bold text-white mb-2">Registration Successful!</h2>
            <p class="text-white-50">Welcome to the elite network. Redirecting to login...</p>
            <div class="spinner-border text-light mt-3" role="status"></div>
        </div>
    </div>

    <div class="signup-container">
        <div class="glass-card">
            
            <div class="text-center mb-4">
                <div class="brand-logo mb-2">
                    <i class=""></i>
                </div>
                <h2 class="fw-bold"><span class="text-gradient">Create Account</span></h2>
                <p class="text-secondary small">Join the elite network of professionals</p>
            </div>

            <form id="signupForm">
                <div class="mb-3" id="nameStep">
                    <label class="custom-label">Full Name</label>
                    <div class="input-group-custom">
                        <i class="bi bi-person"></i>
                        <input type="text" id="fullName" class="custom-input" placeholder="Enter your name" required>
                    </div>
                </div>

                <div class="mb-3" id="emailStep">
                    <label class="custom-label">Email Address</label>
                    <div class="input-group-custom">
                        <i class="bi bi-envelope"></i>
                        <input type="email" id="email" class="custom-input pe-5" placeholder="name@company.com" required>
                        <button type="button" id="otpBtn" class="verify-badge-btn" onclick="sendOTP('email')">OTP</button>
                    </div>
                    <div id="otpStatus" class="small mt-1 fw-bold" style="display: none;"></div>
                </div>

                <div class="mb-3" id="otpGroup" style="display: none;">
                    <label class="custom-label text-primary">Verification Code</label>
                    <div class="input-group-custom">
                        <i class="bi bi-shield-check"></i>
                        <input type="text" id="otpInput" class="custom-input border-primary" placeholder="Enter 6-digit OTP" maxlength="6">
                    </div>
                </div>

                <div class="mb-3" id="mobileStep">
                    <label class="custom-label">Mobile Number</label>
                    <div class="input-group-custom">
                        <i class="bi bi-telephone-fill"></i>
                        <input type="tel" id="mobile" class="custom-input" placeholder="+91 00000 00000" required>
                    </div>
                </div>

                <div class="mb-3" id="passwordStep">
                    <label class="custom-label">Password</label>
                    <div class="input-group-custom">
                        <i class="bi bi-shield-lock"></i>
                        <input type="password" id="password" class="custom-input" placeholder="••••••••" required>
                    </div>
                </div>

                <div class="mb-3" id="roleStep">
                    <label class="custom-label">Choose your Role</label>
                    <div class="role-grid">
                        <input type="radio" name="role" id="freelancer" value="FREELANCER" checked>
                        <label for="freelancer" class="role-box">
                            <i class="bi bi-person-workspace"></i>
                            <span>Freelancer</span>
                        </label>

                        <input type="radio" name="role" id="client" value="CLIENT">
                        <label for="client" class="role-box">
                            <i class="bi bi-briefcase-fill"></i>
                            <span>Client</span>
                        </label>
                    </div>
                </div>

               <div class="mb-4 form-check">
    <input type="checkbox" class="form-check-input" id="terms" required>
    <label class="form-check-label small text-secondary" for="terms">
        I agree to the <a href="terms.html" class="brand-link text-decoration-none">Terms & Conditions</a>
    </label>
</div>

<!-- Naya: Newsletter Checkbox (Terms ke niche) -->
<div class="mb-4 form-check">
    <input type="checkbox" class="form-check-input" id="newsletterOptIn">
    <label class="form-check-label small text-secondary" for="newsletterOptIn">
        Yes, send me trending news(optional)
    </label>
</div>

<button type="submit" id="registerBtn" class="register-submit-btn">Register Now</button>
                <div id="formStatus" class="small text-center mt-2 fw-bold" style="display: none;"></div>
            </form>

            <div class="auth-divider"><span>OR CONTINUE WITH</span></div>

            <div class="social-grid" id="socialStep">
                <button type="button" class="social-action" onclick="loginWithGoogle()">
                    <i class="bi bi-google"></i> Google
                </button>
                <!-- <button type="button" class="social-action" onclick="loginWithGithub()">
                    <i class="bi bi-github"></i> GitHub
                </button> -->
            </div>

            <div class="footer-links-container">
                <p class="mb-1">Already a member? <a href="login.html" class="brand-link">Login here</a></p>
                <a href="index.html" class="home-link"><i class="bi bi-house-door-fill me-1"></i> Back to Home Page</a>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/intro.js/minified/intro.min.js"></script>
    <script src="/script/signup.js"></script>
</body>
</html>
