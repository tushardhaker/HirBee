<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | User Activity Monitor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --admin-bg: #f8f9fa;
            --primary-purple: #8C4EC9;
            --dark-navy: #0f172a;
            --success-glow: #22c55e;
            --warning-glow: #f59e0b;
        }

        body {
            background-color: var(--admin-bg);
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #334155;
        }

        .activity-card {
            background: white;
            border-radius: 16px;
            border: none;
            box-shadow: 0 4px 24px rgba(0,0,0,0.06);
            overflow: hidden;
        }

        .table thead {
            background-color: var(--dark-navy);
            color: white;
        }

        .table thead th {
            padding: 16px;
            font-weight: 600;
            border: none;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .table tbody tr {
            transition: all 0.2s ease;
        }

        .table tbody tr:hover {
            background-color: #fdfaff;
        }

        .badge-activity {
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.7rem;
            font-weight: 800;
            text-transform: uppercase;
        }

        /* Dynamic Colors */
        .bg-click { background: #dcfce7; color: #15803d; }
        .bg-abandoned { background: #fee2e2; color: #b91c1c; }
        .bg-visit { background: #e0f2fe; color: #0369a1; }
        .bg-exit { background: #fef3c7; color: #92400e; }
        .bg-default { background: #f1f5f9; color: #475569; }

        .user-icon {
            width: 32px;
            height: 32px;
            background: var(--primary-purple);
            color: white;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .live-indicator {
            width: 8px;
            height: 8px;
            background: var(--success-glow);
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(34, 197, 94, 0); }
            100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }

        code { font-size: 0.8rem; color: var(--primary-purple); }

        .filter-input, .filter-select {
            border-radius: 12px !important;
            border: 1px solid #dee2e6;
        }

        .filter-input:focus, .filter-select:focus {
            border-color: var(--primary-purple);
            box-shadow: 0 0 0 0.25rem rgba(140, 78, 201, 0.25);
        }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="row align-items-center mb-5">
        <div class="col-md-5">
            <h2 class="fw-bold mb-1">System Audit Logs</h2>
             <a href="admin-dashboard.html" class="btn btn-back rounded-pill px-4">
                    <i class="bi bi-arrow-left me-2"></i>Back
                </a>
            <p class="text-muted mb-0"><span class="live-indicator"></span> Live monitoring enabled</p>
        </div>
        <div class="col-md-7 text-md-end mt-3 mt-md-0">
            <button class="btn btn-outline-primary rounded-pill px-4 me-2" onclick="sendTestActivity()">
                <i class="bi bi-bug me-2"></i>Send Test Data
            </button>
            <!-- <button class="btn btn-white border shadow-sm rounded-pill px-4 me-2" onclick="clearLogs()">
                <i class="bi bi-trash3 me-2 text-danger"></i>Clear Logs
            </button> -->
            <button class="btn btn-primary rounded-pill px-4" style="background: var(--primary-purple); border:none;" onclick="fetchActivities()">
                <i class="bi bi-arrow-clockwise me-2"></i>Refresh
            </button>
        </div>
    </div>

    <!-- Filters -->
    <div class="card border-0 shadow-lg mb-4">
        <div class="card-body">
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label fw-bold">User Identity</label>
                    <input type="text" class="form-control filter-input" id="filterUser" placeholder="Email or name..." onkeyup="applyFilters()">
                </div>
                <div class="col-md-3">
                    <label class="form-label fw-bold">Role</label>
                    <select class="form-select filter-select" id="filterRole" onchange="applyFilters()">
                        <option value="">All Roles</option>
                        <option value="FREELANCER">Freelancer</option>
                        <option value="CLIENT">Client</option>
                        <option value="ADMIN">Admin</option>
                        <option value="GUEST">Guest</option>
                    </select>
                </div>
                <div class="col-md-5">
                    <label class="form-label fw-bold">Description</label>
                    <input type="text" class="form-control filter-input" id="filterDescription" placeholder="e.g. clicked, abandoned..." onkeyup="applyFilters()">
                </div>
            </div>
        </div>
    </div>

    <div class="row g-4 mb-4">
        <div class="col-md-3">
            <div class="card p-3 activity-card border-bottom border-primary border-4">
                <small class="text-uppercase fw-bold text-muted" style="font-size: 0.65rem;">Total Events</small>
                <h3 class="fw-bold mb-0" id="statTotal">0</h3>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card p-3 activity-card border-bottom border-danger border-4">
                <small class="text-uppercase fw-bold text-muted" style="font-size: 0.65rem;">Abandoned Tasks</small>
                <h3 class="fw-bold mb-0 text-danger" id="statAbandoned">0</h3>
            </div>
        </div>
    </div>

    <div class="card activity-card">
        <div class="table-responsive">
            <table class="table align-middle mb-0">
                <thead>
                    <tr>
                        <th>User Identity</th>
                        <th>Role</th>
                        <th>Type</th>
                        <th>Description</th>
                        <th>Path</th>
                        <th>Timestamp</th>
                    </tr>
                </thead>
                <tbody id="activityTableBody">
                    <tr>
                        <td colspan="6" class="text-center py-5">
                            <div class="spinner-border text-primary spinner-border-sm me-2"></div>
                            Connecting to API...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const API_BASE_URL = 'https://hirbee-1.onrender.com/api/admin';
    let allActivities = [];

    async function fetchActivities() {
        try {
            const tbody = document.getElementById('activityTableBody');
            tbody.innerHTML = '<tr><td colspan="6" class="text-center py-5"><div class="spinner-border text-primary"></div><p class="mt-3">Loading activities...</p></td></tr>';
            
            const response = await fetch(`${API_BASE_URL}/activities?_=${Date.now()}`);
            if (!response.ok) throw new Error('API error: ' + response.status);
            
            allActivities = await response.json();
            renderActivities(allActivities);
        } catch (error) {
            console.error('Fetch Error:', error);
            document.getElementById('activityTableBody').innerHTML = `
                <tr><td colspan="6" class="text-center text-danger py-4">
                <i class="bi bi-exclamation-triangle-fill me-2"></i> Server connection failed. Check backend on 8080.
                </td></tr>`;
        }
    }

    function renderActivities(data) {
        const tbody = document.getElementById('activityTableBody');
        
        document.getElementById('statTotal').innerText = data.length;
        document.getElementById('statAbandoned').innerText = data.filter(i => i.activityType === 'ABANDONED').length;

        if (!data || data.length === 0) {
            tbody.innerHTML = `<tr><td colspan="6" class="text-center py-5 text-muted">No activities recorded yet.</td></tr>`;
            return;
        }

        tbody.innerHTML = data.map(item => {
            const typeClass = item.activityType ? item.activityType.toLowerCase() : 'default';
            const initial = item.userEmail ? item.userEmail.charAt(0).toUpperCase() : '?';
            const date = new Date(item.timestamp);
            
            return `
                <tr>
                    <td>
                        <div class="d-flex align-items-center gap-2">
                            <div class="user-icon">${initial}</div>
                            <span class="fw-bold small">${item.userEmail || 'Guest'}</span>
                        </div>
                    </td>
                    <td><span class="text-muted small">${item.userRole || 'Unknown'}</span></td>
                    <td><span class="badge-activity bg-${typeClass}">${item.activityType || 'EVENT'}</span></td>
                    <td class="small text-dark">${item.description || 'No description'}</td>
                    <td><code>${item.pageUrl || '/'}</code></td>
                    <td>
                        <div class="small fw-bold">${date.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</div>
                        <div class="text-muted" style="font-size: 0.7rem;">${date.toLocaleDateString()}</div>
                    </td>
                </tr>
            `;
        }).join('');
    }

    function applyFilters() {
        const filterUser = document.getElementById('filterUser').value.toLowerCase().trim();
        const filterRole = document.getElementById('filterRole').value.toUpperCase();
        const filterDesc = document.getElementById('filterDescription').value.toLowerCase().trim();

        const filtered = allActivities.filter(item => {
            const userMatch = !filterUser || 
                (item.userEmail && item.userEmail.toLowerCase().includes(filterUser));
            const roleMatch = !filterRole || 
                (item.userRole && item.userRole.toUpperCase() === filterRole);
            const descMatch = !filterDesc || 
                (item.description && item.description.toLowerCase().includes(filterDesc));
            
            return userMatch && roleMatch && descMatch;
        });

        renderActivities(filtered);
    }

    // Send test activity
    async function sendTestActivity() {
        const testData = {
            userEmail: "test@gmail.com",
            userRole: "FREELANCER",
            activityType: "ABANDONED",
            description: "Clicked 'Add Amount' then went back",
            pageUrl: "/wallet.html"
        };

        try {
            const res = await fetch(`${API_BASE_URL}/log-activity`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(testData)
            });
            if(res.ok) {
                alert("Test data sent! Refreshing...");
                fetchActivities();
            }
        } catch (err) {
            alert("Error sending test data.");
        }
    }

    // Clear logs
    async function clearLogs() {
        if (!confirm('Delete all activity logs?')) return;
        try {
            const response = await fetch(`${API_BASE_URL}/activities/clear`, { method: 'DELETE' });
            if (response.ok) {
                alert("Logs cleared!");
                fetchActivities();
            }
        } catch (err) { alert('Clear failed'); }
    }

    // Auto-refresh every 15 seconds
    setInterval(fetchActivities, 15000);
    document.addEventListener('DOMContentLoaded', fetchActivities);
</script>

</body>
</html>
