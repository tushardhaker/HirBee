<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin - Newsletter Subscribers | HirBee</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #F6EEFF;
      --primary: #8C4EC9;
      --secondary: #DFC6F9;
      --accent: #B979F7;
      --dark-accent: #0f172a;
      --text-main: #2D1B41;
      --white: #ffffff;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
    }

    .navbar-brand {
      font-weight: 700;
      color: var(--primary) !important;
    }

    .card {
      border: none;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(140, 78, 201, 0.12);
      overflow: hidden;
      background: var(--white);
    }

    .card-header {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: white;
      border-bottom: none;
    }

    .table th {
      background-color: var(--secondary);
      color: var(--text-main);
      font-weight: 600;
    }

    .table-hover tbody tr:hover {
      background-color: rgba(140, 78, 201, 0.08);
    }

    .badge-role {
      font-size: 0.82rem;
      padding: 0.45em 0.9em;
    }

    .btn-send {
      background: linear-gradient(90deg, var(--primary), var(--accent));
      border: none;
      font-weight: 600;
      transition: all 0.3s;
    }

    .btn-send:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(140, 78, 201, 0.4);
    }

    .btn-send:disabled {
      background: #ccc;
      opacity: 0.7;
    }

    .form-check-input:checked {
      background-color: var(--primary);
      border-color: var(--primary);
    }

    .no-data, .loading {
      text-align: center;
      padding: 4rem 1rem;
      color: #6c757d;
    }

    .select-all-label {
      user-select: none;
      cursor: pointer;
      color: white;
    }

    /* Input Overlay for Title + Message + File */
    .input-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease;
    }

    .input-overlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    .input-card {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: white;
      border-radius: 24px;
      padding: 40px 50px;
      max-width: 600px;
      width: 90%;
      box-shadow: 0 25px 70px rgba(0,0,0,0.6);
      transform: scale(0.8) translateY(40px);
      opacity: 0;
      transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .input-overlay.show .input-card {
      transform: scale(1) translateY(0);
      opacity: 1;
    }

    .input-card h3 {
      font-weight: 700;
      margin-bottom: 1.5rem;
    }

    .input-card .form-label {
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .input-card .form-control,
    .input-card .form-control:focus {
      background: rgba(255,255,255,0.15);
      border: none;
      color: white;
      border-radius: 12px;
      padding: 12px 16px;
    }

    .input-card .form-control::placeholder {
      color: rgba(255,255,255,0.6);
    }

    .input-card .file-upload {
      margin: 1rem 0;
      padding: 1rem;
      background: rgba(255,255,255,0.1);
      border-radius: 12px;
      text-align: center;
      cursor: pointer;
    }

    .input-card .file-upload:hover {
      background: rgba(255,255,255,0.2);
    }

    .input-card .btn {
      width: 100%;
      margin-top: 1rem;
      border-radius: 50px;
      padding: 12px;
      font-weight: 600;
    }

    .input-card .btn-outline-light {
      margin-top: 0.5rem;
    }

    /* Success / Error Feedback Overlay */
    .feedback-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease;
    }

    .feedback-overlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    .feedback-card {
      background: #2ecc71;
      color: white;
      border-radius: 20px;
      padding: 50px 60px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      transform: scale(0.8);
      opacity: 0;
      transition: all 0.5s ease-out;
    }

    .feedback-overlay.show .feedback-card {
      transform: scale(1);
      opacity: 1;
    }

    .feedback-icon {
      font-size: 6rem;
      margin-bottom: 1.5rem;
    }

    .feedback-card h3 {
      font-weight: 700;
      margin-bottom: 1rem;
    }

    .feedback-card p {
      font-size: 1.2rem;
    }

    .feedback-close {
      margin-top: 2rem;
      background: rgba(255,255,255,0.25);
      border: none;
      color: white;
      padding: 12px 40px;
      border-radius: 50px;
      font-weight: 600;
    }

    .feedback-close:hover {
      background: rgba(255,255,255,0.4);
    }

    .feedback-error .feedback-card {
      background: #ff6b6b;
    }
  </style>
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
    <div class="container">
      <a class="navbar-brand" href="admin-dashboard.html">
        <i class="bi bi-arrow-left me-2"></i> Back
      </a>
    </div>
  </nav>

  <div class="container py-5">

    <div class="card mb-4">
      <div class="card-header d-flex justify-content-between align-items-center">
        <h4 class="mb-0 text-white">Newsletter Subscribers</h4>
        <div class="d-flex gap-3 align-items-center">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="selectAll">
            <label class="form-check-label select-all-label" for="selectAll">
              Select All
            </label>
          </div>
          <button id="sendMailBtn" class="btn btn-send px-4" disabled>
            <i class="bi bi-envelope-fill me-2"></i> Send Email to Selected
          </button>
        </div>
      </div>

      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover mb-0">
            <thead>
              <tr>
                <th style="width:60px"></th>
                <th>Email</th>
                <th>Source</th>
                <th>Subscribed On</th>
                <th>User Type</th>
              </tr>
            </thead>
            <tbody id="tableBody">
              <tr><td colspan="5" class="loading">
                <div class="spinner-border text-primary" role="status"></div>
                <p class="mt-3 mb-0">Loading newsletter subscribers...</p>
              </td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <h5 class="mb-0 text-white">Quick Filters</h5>
      </div>
      <div class="card-body">
        <div class="row g-3">
          <div class="col-md-3">
            <select class="form-select" id="filterRole">
              <option value="all">All Users</option>
              <option value="FREELANCER">Freelancers Only</option>
              <option value="CLIENT">Clients Only</option>
              <option value="guest">Guests Only</option>
            </select>
          </div>
          <div class="col-md-3">
            <select class="form-select" id="filterSource">
              <option value="all">All Sources</option>
              <option value="signup">From Signup</option>
              <option value="homepage">From Homepage</option>
            </select>
          </div>
          <div class="col-md-3 d-flex align-items-center">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="hasEmail">
              <label class="form-check-label" for="hasEmail">
                Only with valid email
              </label>
            </div>
          </div>
          <div class="col-md-3">
            <button class="btn btn-outline-secondary w-100" id="clearFilter">
              <i class="bi bi-x-circle me-2"></i> Clear Filters
            </button>
          </div>
        </div>
      </div>
    </div>

  </div>

  <!-- Input Overlay for Title + Message + File -->
  <div id="inputOverlay" class="input-overlay">
    <div class="input-card">
      <h3>Compose Newsletter</h3>
      <div class="mb-3">
        <label class="form-label">Title / Subject</label>
        <input type="text" class="form-control" id="inputTitle" placeholder="e.g. Latest Job Opportunities & Exclusive Offers">
      </div>
      <div class="mb-4">
        <label class="form-label">Message / Description</label>
        <textarea class="form-control" id="inputMessage" rows="7" placeholder="Write your full message here..."></textarea>
      </div>
      <div class="mb-4">
        <label class="form-label">Attach File (optional)</label>
        <input type="file" class="form-control" id="inputFile">
        <small id="fileName" class="text-white-75 mt-1 d-block"></small>
      </div>
      <button id="sendConfirmBtn" class="btn btn-light w-100 py-3 fw-bold">Send Now</button>
      <button id="cancelInputBtn" class="btn btn-outline-light w-100 mt-2 py-2">Cancel</button>
    </div>
  </div>

  <!-- Success / Error Feedback Overlay -->
  <div id="feedbackOverlay" class="feedback-overlay">
    <div class="feedback-card" id="feedbackCard">
      <div id="feedbackIcon" class="feedback-icon"></div>
      <h3 id="feedbackTitle"></h3>
      <p id="feedbackMessage"></p>
      <button class="feedback-close" id="feedbackCloseBtn">Got it</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    const API_BASE = "https://hirbee-1.onrender.com/api";

    let allSubscribers = [];

    async function loadSubscribers() {
      const tbody = document.getElementById("tableBody");
      tbody.innerHTML = `<tr><td colspan="5" class="loading">
        <div class="spinner-border text-primary" role="status"></div>
        <p class="mt-3 mb-0">Loading newsletter subscribers...</p>
      </td></tr>`;

      try {
        const res = await fetch(`${API_BASE}/newsletter/all`);
        if (!res.ok) {
          const errorText = await res.text();
          throw new Error(`HTTP ${res.status}: ${errorText}`);
        }
        allSubscribers = await res.json();
        renderTable(allSubscribers);
      } catch (err) {
        console.error("Fetch error:", err);
        tbody.innerHTML = `<tr><td colspan="5" class="text-center text-danger py-5">
          <i class="bi bi-exclamation-triangle-fill fs-1"></i><br>
          Failed to load subscribers.<br>
          <small>Error: ${err.message}</small>
        </td></tr>`;
      }
    }

    function renderTable(data) {
      const tbody = document.getElementById("tableBody");
      tbody.innerHTML = "";

      if (data.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="no-data">
          No subscribers found.
        </td></tr>`;
        updateSendButton();
        return;
      }

      data.forEach(sub => {
        const row = document.createElement("tr");
        const role = sub.role || 'Guest';
        const badgeClass = role === 'FREELANCER' ? 'bg-primary' :
                           role === 'CLIENT' ? 'bg-success' : 'bg-secondary';

        row.innerHTML = `
          <td>
            <input type="checkbox" class="form-check-input subscriber-check" 
                   value="${sub.email}" data-role="${role.toLowerCase()}">
          </td>
          <td><strong>${sub.email}</strong></td>
          <td><span class="badge bg-secondary">${sub.source || 'unknown'}</span></td>
          <td>${sub.subscribedAt ? new Date(sub.subscribedAt).toLocaleString() : '—'}</td>
          <td><span class="badge ${badgeClass} badge-role">${role}</span></td>
        `;
        tbody.appendChild(row);
      });

      updateSendButton();
      attachCheckboxListeners();
    }

    function attachCheckboxListeners() {
      document.querySelectorAll('.subscriber-check').forEach(chk => {
        chk.addEventListener('change', updateSendButton);
      });

      document.getElementById('selectAll')?.addEventListener('change', e => {
        document.querySelectorAll('.subscriber-check').forEach(chk => {
          chk.checked = e.target.checked;
        });
        updateSendButton();
      });
    }

    function updateSendButton() {
      const checked = document.querySelectorAll('.subscriber-check:checked').length;
      const btn = document.getElementById('sendMailBtn');
      btn.disabled = checked === 0;
      btn.innerHTML = `<i class="bi bi-envelope-fill me-2"></i> Send Email to Selected`;
    }

    function applyFilters() {
      const roleFilter = document.getElementById('filterRole').value;
      const sourceFilter = document.getElementById('filterSource').value;
      const hasEmail = document.getElementById('hasEmail').checked;

      let filtered = [...allSubscribers];

      if (roleFilter !== 'all') {
        if (roleFilter === 'guest') {
          filtered = filtered.filter(s => !s.role);
        } else {
          filtered = filtered.filter(s => (s.role || '').toUpperCase() === roleFilter);
        }
      }

      if (sourceFilter !== 'all') {
        filtered = filtered.filter(s => (s.source || '').toLowerCase() === sourceFilter);
      }

      if (hasEmail) {
        filtered = filtered.filter(s => s.email && s.email.includes('@'));
      }

      renderTable(filtered);
    }

    document.getElementById('filterRole')?.addEventListener('change', applyFilters);
    document.getElementById('filterSource')?.addEventListener('change', applyFilters);
    document.getElementById('hasEmail')?.addEventListener('change', applyFilters);

    document.getElementById('clearFilter')?.addEventListener('click', () => {
      document.getElementById('filterRole').value = 'all';
      document.getElementById('filterSource').value = 'all';
      document.getElementById('hasEmail').checked = false;
      applyFilters();
    });

    // Click Send Email → open input overlay
    document.getElementById('sendMailBtn')?.addEventListener('click', () => {
      // Reset fields
      document.getElementById('inputTitle').value = '';
      document.getElementById('inputMessage').value = '';
      document.getElementById('inputFile').value = '';
      document.getElementById('fileName').textContent = '';

      document.getElementById('inputOverlay').style.display = 'flex';
      setTimeout(() => document.getElementById('inputOverlay').classList.add('show'), 10);
    });

    // File name show when selected
    document.getElementById('inputFile')?.addEventListener('change', e => {
      const file = e.target.files[0];
      document.getElementById('fileName').textContent = file ? file.name : 'No file selected';
    });

    // Send button inside overlay
    document.getElementById('sendConfirmBtn')?.addEventListener('click', async () => {
      const title = document.getElementById('inputTitle').value.trim();
      const message = document.getElementById('inputMessage').value.trim();
      const fileInput = document.getElementById('inputFile');

      if (!title || !message) {
        alert("Title and message are required.");
        return;
      }

      const selectedEmails = Array.from(document.querySelectorAll('.subscriber-check:checked'))
                                 .map(chk => chk.value);

      if (selectedEmails.length === 0) return;

      // Hide input overlay
      document.getElementById('inputOverlay').classList.remove('show');
      setTimeout(() => document.getElementById('inputOverlay').style.display = 'none', 500);

      // Show sending
      showFeedbackOverlay("Sending...", "Please wait...", "info");

      try {
        const formData = new FormData();
        formData.append('emails', JSON.stringify(selectedEmails));
        formData.append('subject', title);
        formData.append('message', message);
        if (fileInput.files[0]) {
          formData.append('attachment', fileInput.files[0]);
        }

        const res = await fetch(`${API_BASE}/newsletter/send-bulk`, {
          method: 'POST',
          body: formData  // no Content-Type — browser sets it with boundary
        });

        if (res.ok) {
          showFeedbackOverlay("Success!", `Emails sent to ${selectedEmails.length} subscribers!`, "success");
        } else {
          showFeedbackOverlay("Failed", "Could not send emails.", "error");
        }
      } catch (err) {
        showFeedbackOverlay("Error", "Network issue: " + err.message, "error");
      }
    });

    // Cancel input overlay
    document.getElementById('cancelInputBtn')?.addEventListener('click', () => {
      document.getElementById('inputOverlay').classList.remove('show');
      setTimeout(() => document.getElementById('inputOverlay').style.display = 'none', 500);
    });

    function showFeedbackOverlay(title, message, type = 'success') {
      const overlay = document.getElementById('feedbackOverlay');
      const card = document.getElementById('feedbackCard');
      const iconEl = document.getElementById('feedbackIcon');
      const titleEl = document.getElementById('feedbackTitle');
      const msgEl = document.getElementById('feedbackMessage');

      titleEl.textContent = title;
      msgEl.textContent = message;

      card.className = `feedback-card ${type}`;

      iconEl.innerHTML = type === 'success' 
        ? '<i class="bi bi-check-circle-fill"></i>'
        : type === 'error'
          ? '<i class="bi bi-x-circle-fill"></i>'
          : '<i class="bi bi-hourglass-split"></i>';

      overlay.style.display = 'flex';
      setTimeout(() => overlay.classList.add('show'), 10);

      setTimeout(() => {
        overlay.classList.remove('show');
        setTimeout(() => overlay.style.display = 'none', 500);
      }, 3500);
    }

    window.addEventListener('load', loadSubscribers);
  </script>
</body>
</html>
