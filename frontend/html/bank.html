<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank Details | Local-Lance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="/css/bank.css">
</head>
<body>

    <div id="toast-container"></div>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card p-4 p-md-5">
                    
                    <div class="mb-4">
                        <a onclick="goBackToDashboard()" class="back-link small fw-bold">
                            <i class="bi bi-arrow-left"></i> Back to Dashboard
                        </a>
                        <h3 class="fw-bold mt-3 mb-1">Payment Settings</h3>
                        <p class="text-muted small">Manage where you receive your earnings securely.</p>
                    </div>

                    <form id="bankDetailsForm">
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Account Holder Name</label>
                            <input type="text" id="holderName" class="form-control" placeholder="Full name as per bank records" required>
                        </div>

                        <div class="mb-4">
                            <label class="form-label small fw-bold">UPI ID (Recommended)</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-qr-code-scan"></i></span>
                                <input type="text" id="upiId" class="form-control" placeholder="username@upi">
                            </div>
                        </div>

                        <div class="text-center position-relative my-4">
                            <hr class="text-muted opacity-25">
                            <span class="position-absolute top-50 start-50 translate-middle bg-white px-3 or-divider">OR DIRECT BANK</span>
                        </div>

                        <div class="mb-3">
                            <label class="form-label small fw-bold">Account Number</label>
                            <input type="text" id="accNo" class="form-control" placeholder="Enter your account number">
                        </div>

                        <div class="mb-4">
                            <label class="form-label small fw-bold">IFSC Code</label>
                            <input type="text" id="ifsc" class="form-control" placeholder="e.g. HDFC0001234">
                        </div>

                        <button type="submit" id="submitBtn" class="btn btn-save shadow-sm">
                            <span id="btnLabel"><i class="bi bi-check2-circle me-2"></i>Update Payment Details</span>
                        </button>
                    </form>

                    <div class="security-badge text-center mt-4">
                        <p class="text-muted small mb-0">
                            <i class="bi bi-shield-lock-fill text-primary me-1"></i> 
                            Your data is encrypted with 256-bit SSL security.
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/script/bank.js"></script>
</body>
</html>
