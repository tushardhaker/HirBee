<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Earnings | Local-Lance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --primary-purple: #8C4EC9; 
            --bg-lavender: #F6EEFF; 
            --secondary-lilac: #DFC6F9;
            --text-dark: #2D1B41;
            --purple-gradient: linear-gradient(135deg, #6f42c1 0%, #a259ff 100%);
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #f8f9fa; 
            margin: 0;
        }

        /* Brand Color */
        .brand-text { color: var(--primary-purple) !important; font-weight: 800; letter-spacing: -0.5px; }

        /* Sidebar Desktop */
        .sidebar {
            width: 260px;
            height: 100vh;
            position: fixed;
            left: 0;
            top: 0;
            background: white;
            border-right: 1px solid var(--secondary-lilac);
            z-index: 1000;
            transition: all 0.3s;
        }

        .main-content {
            margin-left: 260px;
            transition: all 0.3s;
            min-height: 100vh;
        }

        /* Sidebar Links */
        .nav-link {
            padding: 12px 20px;
            border-radius: 12px;
            color: var(--text-dark);
            font-weight: 600;
            margin-bottom: 5px;
            transition: 0.3s;
        }
        .nav-link:hover { background: var(--bg-lavender); color: var(--primary-purple); }
        .nav-link.active { background: var(--primary-purple) !important; color: white !important; }

        /* Mobile Header */
        .mobile-header {
            display: none;
            background: white;
            border-bottom: 1px solid var(--secondary-lilac);
            padding: 15px;
            position: sticky;
            top: 0;
            z-index: 999;
        }

        /* Earning Hero Card - now purple */
        .earning-hero-card { 
            background: var(--purple-gradient); 
            border-radius: 24px; 
            padding: 2.5rem !important;
        }

        .btn-withdraw-glow { 
            background: white; 
            color: var(--primary-purple); 
            border: none; 
            transition: 0.3s; 
        }
        .btn-withdraw-glow:hover { 
            transform: translateY(-3px); 
            box-shadow: 0 10px 20px rgba(140, 78, 201, 0.25); 
        }

        .btn-primary {
            background: var(--primary-purple) !important;
            border-color: var(--primary-purple) !important;
        }
        .btn-primary:hover {
            background: #7a3fb3 !important;
            border-color: #7a3fb3 !important;
        }

        /* Export Button */
        .btn-export-outline {
            border: 1px solid var(--primary-purple);
            color: var(--primary-purple);
            background: transparent;
            font-size: 0.85rem;
            font-weight: 600;
            transition: 0.2s;
        }
        .btn-export-outline:hover {
            background: var(--primary-purple);
            color: white;
        }

        .tx-item { border-radius: 16px; background: white; border: 1px solid #eee; transition: 0.2s; }
        .icon-circle { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; }

        /* Toast Styling - purple accent */
        #toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; }
        .custom-toast {
            min-width: 280px; padding: 16px; margin-bottom: 10px; border-radius: 16px;
            background: white; box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            display: flex; align-items: center; gap: 12px; border-left: 6px solid var(--primary-purple);
        }

        /* Spinner & links */
        .text-primary, .spinner-border { color: var(--primary-purple) !important; }

        /* Responsiveness */
        @media (max-width: 991.98px) {
            .sidebar { display: none; }
            .main-content { margin-left: 0; }
            .mobile-header { display: flex; align-items: center; justify-content: space-between; }
            .earning-hero-card { padding: 1.5rem !important; text-align: center; }
            .earning-hero-card h1 { font-size: 2.5rem; }
            .btn-withdraw-glow { width: 100%; }
        }

        @media (max-width: 576px) {
            .tx-item { flex-direction: column; align-items: flex-start !important; gap: 10px; }
            .tx-item .amount-tag { align-self: flex-end; }
        }
    </style>
</head>
<body>

<div id="toast-container"></div>

<div class="mobile-header">
    <button class="btn btn-light border" data-bs-toggle="offcanvas" data-bs-target="#mobileSidebar">
        <i class="bi bi-list fs-4"></i>
    </button>
    <h5 class="brand-text mb-0"></h5>
    <div style="width: 45px;"></div>
</div>

<nav class="sidebar p-3 shadow-sm d-none d-lg-block">
    <div class="brand mb-4 px-3 text-center">
        <h4 class="brand-text"></h4>
    </div>
    <ul class="nav flex-column gap-1">
        <li class="nav-item"><a href="freelancer-dashboard.html" class="nav-link"><i class="bi bi-search me-2"></i> Find Jobs</a></li>
        <li class="nav-item"><a href="my-proposals.html" class="nav-link"><i class="bi bi-file-earmark-text me-2"></i> My Proposals</a></li>
        <li class="nav-item"><a href="wallet.html" class="nav-link active"><i class="bi bi-wallet2 me-2"></i> My Earnings</a></li>
        
        <li class="nav-item mt-5">
            <a href="freelancer-dashboard.html" class="nav-link text-muted small">
                <i class="bi bi-arrow-left me-2"></i> Back to Dashboard
            </a>
        </li>
    </ul>
</nav>

<div class="offcanvas offcanvas-start" tabindex="-1" id="mobileSidebar">
    <div class="offcanvas-header border-bottom">
        <h5 class="offcanvas-title brand-text"></h5>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
    </div>
    <div class="offcanvas-body">
        <ul class="nav flex-column gap-1">
            <li class="nav-item"><a href="freelancer-dashboard.html" class="nav-link"><i class="bi bi-search me-2"></i> Find Jobs</a></li>
            <li class="nav-item"><a href="my-proposals.html" class="nav-link"><i class="bi bi-file-earmark-text me-2"></i> My Proposals</a></li>
            <li class="nav-item"><a href="wallet.html" class="nav-link active"><i class="bi bi-wallet2 me-2"></i> My Earnings</a></li>

            <hr>
            
        </ul>
    </div>
</div>

<main class="main-content p-3 p-md-4">
    <div class="container-fluid">
        <header class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="fw-bold mb-0">Financial Overview</h3>
            <div class="security-badge d-none d-md-block px-3 py-2 rounded-pill small bg-white border">
                <i class="bi bi-shield-check text-success"></i> Secured Wallet
            </div>
        </header>

        <div class="card earning-hero-card border-0 shadow-lg mb-5 text-white">
            <div class="row align-items-center">
                <div class="col-lg-7">
                    <p class="mb-1 opacity-75 fw-medium">Available for Withdrawal</p>
                    <h1 class="display-3 fw-bold mb-0">₹<span id="totalBalance">0.00</span></h1>
                </div>
                <div class="col-lg-5 text-lg-end mt-4 mt-lg-0">
                    <button class="btn btn-withdraw-glow btn-lg rounded-pill fw-bold px-5 py-3 w-100-mobile" data-bs-toggle="modal" data-bs-target="#withdrawModal">
                        <i class="bi bi-wallet2 me-2"></i> Withdraw Now
                    </button>
                </div>
            </div>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h5 class="fw-bold mb-0"><i class="bi bi-clock-history me-2 text-primary"></i> Recent Activity</h5>
            <button onclick="exportEarningsCSV()" class="btn btn-export-outline rounded-pill px-3 py-1">
                <i class="bi bi-download me-1"></i> Export CSV
            </button>
        </div>
        
        <div id="txList" class="d-flex flex-column gap-2">
            <div class="text-center p-5"><div class="spinner-border text-primary"></div></div>
        </div>
    </div>
</main>

<div class="modal fade" id="withdrawModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-fullscreen-sm-down">
        <div class="modal-content border-0 rounded-4 shadow-lg">
            <div class="modal-header border-0 pb-0">
                <h5 class="fw-bold">Withdraw Funds</h5>
                <button class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body p-4">
                <div class="mb-4">
                    <label class="small fw-bold text-muted mb-2">Amount to Withdraw (₹)</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light">₹</span>
                        <input type="number" id="wAmount" oninput="calculateFee()" class="form-control form-control-lg" placeholder="0.00">
                    </div>
                </div>
                
                <div id="feeCalc" class="mb-4 small text-muted p-3 rounded-3 bg-light" style="display: none;">
                    <div class="d-flex justify-content-between mb-1">
                        <span>Platform Fee (10%):</span>
                        <span class="text-danger">-₹<span id="feeDisplay">0.00</span></span>
                    </div>
                    <div class="d-flex justify-content-between fw-bold text-dark border-top pt-1 mt-1">
                        <span>You will receive:</span>
                        <span>₹<span id="finalDisplay">0.00</span></span>
                    </div>
                </div>

                <div id="bankInfo" class="text-center p-3 mb-4 rounded-3 border bg-white">
                    <div class="spinner-border spinner-border-sm text-primary"></div>
                </div>

                <button id="wBtn" onclick="processWithdraw()" class="btn btn-primary w-100 rounded-pill py-3 fw-bold shadow-sm" disabled>
                    Confirm Withdrawal
                </button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const email = localStorage.getItem('userEmail');
    const API_BASE = "https://hirbee-1.onrender.com/api";
    let allTransactions = []; // To store data for export

    function showNotify(message, type = 'success') {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        toast.className = `custom-toast toast-${type}`;
        const icon = type === 'success' ? 'bi-check-circle-fill text-success' : 'bi-exclamation-triangle-fill text-danger';
        toast.innerHTML = `<i class="bi ${icon} fs-5"></i><div><div class="fw-bold small text-dark">${type === 'success' ? 'Success' : 'Error'}</div><div class="text-muted small">${message}</div></div>`;
        container.appendChild(toast);
        setTimeout(() => { toast.style.transition = '0.3s'; toast.style.opacity = '0'; toast.style.transform = 'translateX(100%)'; setTimeout(() => toast.remove(), 300); }, 3500);
    }

   function calculateFee() {
    const amt = document.getElementById('wAmount').value;
    const feeDiv = document.getElementById('feeCalc');
    if (amt > 0) {
        const fee = (amt * 0.10).toFixed(2);          // ← 0.25 → 0.10
        const final = (amt - fee).toFixed(2);
        document.getElementById('feeDisplay').innerText = fee;
        document.getElementById('finalDisplay').innerText = final;
        feeDiv.style.display = 'block';
    } else { 
        feeDiv.style.display = 'none'; 
    }
}

    async function init() {
        if (!email) { window.location.href = "login.html"; return; }
        loadBalance();
        loadRecentTransactions();
        checkBankStatus();
    }

    async function loadBalance() {
        try {
            const res = await fetch(`${API_BASE}/wallet/balance?email=${email}`);
            const data = await res.json();
            document.getElementById('totalBalance').innerText = data.balance.toLocaleString('en-IN', {minimumFractionDigits: 2});
        } catch(e) { console.error(e); }
    }

    async function loadRecentTransactions() {
        try {
            const res = await fetch(`${API_BASE}/wallet/transactions?email=${email}`);
            const container = document.getElementById('txList');
            if (res.ok) {
                let txs = await res.json();
                txs.sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp));
                allTransactions = txs; // Store all for CSV
                
                const recent = txs.slice(0, 5); 
                
                if(recent.length === 0) {
                    container.innerHTML = `<div class="text-center p-4 bg-white rounded-4 border">No history yet</div>`;
                    return;
                }

                container.innerHTML = recent.map(t => {
                    const isCredit = t.receiverEmail === email;
                    return `
                    <div class="card p-3 border-0 shadow-sm d-flex flex-row justify-content-between align-items-center tx-item mb-2">
                        <div class="d-flex align-items-center">
                            <div class="icon-circle ${isCredit ? 'bg-success text-success' : 'bg-danger text-danger'} bg-opacity-10 me-3">
                                <i class="bi ${isCredit ? 'bi-plus-lg' : 'bi-dash-lg'}"></i>
                            </div>
                            <div>
                                <b class="text-dark d-block">${isCredit ? 'Payment Received' : 'Withdrawal'}</b>
                                <small class="text-muted" style="font-size: 0.75rem;">${new Date(t.timestamp).toLocaleDateString()}</small>
                            </div>
                        </div>
                        <span class="${isCredit ? 'text-success' : 'text-danger'} fw-bold amount-tag">
                            ${isCredit ? '+' : '-'}₹${t.amount.toFixed(2)}
                        </span>
                    </div>`;
                }).join('');
            }
        } catch(e) { document.getElementById('txList').innerHTML = "Error loading history."; }
    }

    // Export to CSV Function
    function exportEarningsCSV() {
        if (allTransactions.length === 0) {
            showNotify("No transactions to export", "error");
            return;
        }

        const headers = ["Date", "Type", "Amount (INR)", "Status"];
        const rows = allTransactions.map(t => {
            const isCredit = t.receiverEmail === email;
            return [
                new Date(t.timestamp).toLocaleDateString(),
                isCredit ? "Credit (Payment)" : "Debit (Withdrawal)",
                isCredit ? t.amount : -t.amount,
                "Success"
            ];
        });

        let csvContent = "data:text/csv;charset=utf-8," 
            + headers.join(",") + "\n" 
            + rows.map(e => e.join(",")).join("\n");

        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `Earnings_Report_${new Date().toLocaleDateString()}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    async function checkBankStatus() {
        try {
            const bankRes = await fetch(`${API_BASE}/bank/my-details?email=${encodeURIComponent(email)}`);
            if(bankRes.ok) {
                const bank = await bankRes.json();
                document.getElementById('bankInfo').innerHTML = `<span class="small fw-bold text-primary"><i class="bi bi-bank me-2"></i>Target: ${bank.accountHolderName} (****${bank.accountNumber.slice(-4)})</span>`;
                document.getElementById('wBtn').disabled = false;
            } else {
                document.getElementById('bankInfo').innerHTML = `<span class="text-danger small fw-bold">No Bank Linked! <a href="bank_account.html">Link Now</a></span>`;
            }
        } catch(e) { console.error(e); }
    }

    async function processWithdraw() {
        const amt = document.getElementById('wAmount').value;
        const wBtn = document.getElementById('wBtn');
        if(!amt || amt <= 0) { showNotify("Enter a valid amount", "error"); return; }
        
        wBtn.disabled = true;
        wBtn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span>Processing...`;

        try {
            const res = await fetch(`${API_BASE}/wallet/withdraw`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ email: email, amount: amt })
            });
            if(res.ok) { 
                showNotify("Withdrawal successful!", "success");
                setTimeout(() => location.reload(), 2000); 
            } else { 
                const msg = await res.text();
                showNotify(msg, "error");
                wBtn.disabled = false;
                wBtn.innerHTML = `Confirm Withdrawal`;
            }
        } catch (e) {
            showNotify("Server error", "error");
            wBtn.disabled = false;
            wBtn.innerHTML = `Confirm Withdrawal`;
        }
    }

    function logout() { localStorage.clear(); window.location.href = 'login.html'; }
    init();
</script>
</body>
</html>
