<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Moderation | Admin Control</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-lavender: #F6EEFF;
            --primary-purple: #8C4EC9;
            --secondary-lilac: #DFC6F9;
            --accent-orchid: #B979F7;
            --dark-purple: #6A359C;
            --danger-red: #ff4d4d;
            --success-green: #2ecc71;
        }

        body { 
            background-color: var(--bg-lavender); 
            font-family: 'Plus Jakarta Sans', sans-serif; 
        }

        .navbar {
            background-color: var(--primary-purple) !important;
            padding: 1rem 0;
        }
        .btn-back {
            color: white;
            text-decoration: none;
            font-weight: 600;
            display: flex;
            align-items: center;
            transition: 0.3s;
        }
        .btn-back:hover { color: var(--secondary-lilac); transform: translateX(-5px); }

        .mod-card {
            background: white;
            border-radius: 24px;
            border: 1px solid var(--secondary-lilac);
            transition: all 0.3s ease;
            height: 100%;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .mod-card:hover {
            box-shadow: 0 15px 35px rgba(140, 78, 201, 0.15);
            transform: translateY(-5px);
        }

        .status-strip { height: 6px; width: 100%; }
        .status-active { background-color: var(--success-green); }
        .status-banned { background-color: var(--danger-red); }

        .btn-action {
            border-radius: 50px;
            font-weight: 700;
            padding: 10px 20px;
            transition: 0.3s;
            text-transform: uppercase;
            font-size: 0.85rem;
            border: none;
        }

        .btn-ban { background-color: #fff0f0; color: var(--danger-red); }
        .btn-ban:hover { background-color: var(--danger-red); color: white; }

        .btn-unban { background-color: #f0fff4; color: var(--success-green); }
        .btn-unban:hover { background-color: var(--success-green); color: white; }

        /* Purple theme overrides */
        .text-purple { color: var(--primary-purple) !important; }
        .spinner-purple { color: var(--primary-purple) !important; }
        .btn-purple-gradient {
            background: linear-gradient(135deg, var(--primary-purple), var(--accent-orchid));
            color: white;
            border: none;
        }
        .read-more-btn {
            color: var(--primary-purple);
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            text-decoration: underline;
            margin-left: 5px;
        }
        .read-more-btn:hover {
            color: var(--accent-orchid);
        }
        .job-description {
            line-height: 1.6;
            color: #4a5568;
            max-height: 4.8em; /* approx 3-4 lines */
            overflow: hidden;
            transition: max-height 0.3s ease;
        }
        .job-description.expanded {
            max-height: none;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark shadow-sm mb-5">
        <div class="container">
            <a class="btn-back" href="admin-dashboard.html">
                <i class="bi bi-arrow-left-circle-fill fs-4 me-2"></i> Dashboard
            </a>
            <span class="navbar-text text-white fw-bold">
                <i class="bi bi-shield-lock-fill me-2"></i> JOB MODERATION
            </span>
        </div>
    </nav>

    <div class="container mb-5">
        <div class="row mb-4 align-items-center">
            <div class="col-md-7">
                <h1 class="fw-bold text-dark mb-1">System Job Control</h1>
                <p class="text-muted">Manage visibility of gigs across the platform.</p>
            </div>
            <div class="col-md-5 text-md-end">
                <div class="bg-white d-inline-block p-3 rounded-4 border shadow-sm">
                    <span class="text-muted small fw-bold d-block mb-1">ACTIVE DATABASE JOBS</span>
                    <h3 class="fw-bold mb-0 text-purple" id="jobCount">0</h3>
                </div>
            </div>
        </div>

        <div class="row g-4" id="moderationContainer">
            <div class="col-12 text-center p-5">
                <div class="spinner-border spinner-purple" role="status"></div>
                <p class="mt-3">Fetching Jobs for Moderation...</p>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = "https://hirbee-1.onrender.com/api/jobs";

        async function fetchAllJobs() {
            const container = document.getElementById('moderationContainer');
            try {
                const res = await fetch(`${API_BASE}/admin-all`);
                const jobs = await res.json();
                renderJobs(jobs);
            } catch (error) {
                container.innerHTML = `<div class="col-12 text-center text-danger p-5"><h4>Server Connection Error</h4></div>`;
            }
        }

        function toggleDescription(btn) {
            const container = btn.closest('.job-description-container');
            const fullText = container.getAttribute('data-full');
            const truncated = container.getAttribute('data-truncated');

            if (btn.textContent.includes('Read More')) {
                container.querySelector('.job-description').innerHTML = fullText;
                btn.textContent = 'Show Less';
            } else {
                container.querySelector('.job-description').innerHTML = truncated + '...';
                btn.textContent = 'Read More';
            }
        }

        function renderJobs(jobs) {
            const container = document.getElementById('moderationContainer');
            document.getElementById('jobCount').innerText = jobs.length;

            if (jobs.length === 0) {
                container.innerHTML = `<div class="col-12 text-center p-5 text-muted">No jobs found in database.</div>`;
                return;
            }

            container.innerHTML = jobs.map(job => {
                const isBanned = job.status === "BANNED";
                const originalDetails = job.details || "No description provided.";
                const charLimit = 150;
                let displayDetails = originalDetails;
                let readMoreHtml = "";

                if (originalDetails.length > charLimit) {
                    const truncated = originalDetails.substring(0, charLimit);
                    displayDetails = truncated + '...';
                    readMoreHtml = `<span class="read-more-btn" onclick="toggleDescription(this)">Read More</span>`;
                }

                return `
                <div class="col-md-6 col-lg-4">
                    <div class="mod-card shadow-sm">
                        <div class="status-strip ${isBanned ? 'status-banned' : 'status-active'}"></div>
                        <div class="p-4">
                            <div class="d-flex justify-content-between align-items-center mb-3">
                                <span class="badge bg-light text-dark border">#ID-${job.id}</span>
                                <span class="badge ${isBanned ? 'bg-danger' : 'bg-success'}">
                                    ${isBanned ? 'BANNED' : 'ACTIVE'}
                                </span>
                            </div>
                            
                            <h6 class="fw-bold text-purple mb-1">${job.clientEmail}</h6>
                            
                            <div class="job-description-container mb-3" 
                                 data-full="${originalDetails.replace(/"/g, '&quot;')}" 
                                 data-truncated="${displayDetails.replace(/"/g, '&quot;')}">
                                <div class="job-description">
                                    ${displayDetails}
                                </div>
                                ${readMoreHtml}
                            </div>
                            
                            <div class="d-flex justify-content-between mb-4 border-top pt-2">
                                <span class="small fw-bold">Budget: ₹${job.budget}</span>
                                <span class="small text-uppercase text-secondary">${job.mode}</span>
                            </div>

                            <button id="btn-${job.id}" 
                                    class="btn w-100 btn-action ${isBanned ? 'btn-unban' : 'btn-ban'}"
                                    onclick="toggleJobBan(${job.id}, ${isBanned})">
                                <i class="bi ${isBanned ? 'bi-check-circle-fill' : 'bi-slash-circle-fill'} me-2"></i>
                                ${isBanned ? 'Unban Job' : 'Ban Job'}
                            </button>
                        </div>
                    </div>
                </div>`;
            }).reverse().join('');
        }

        async function toggleJobBan(jobId, currentlyBanned) {
            const btn = document.getElementById(`btn-${jobId}`);
            btn.disabled = true;
            
            const newStatus = currentlyBanned ? "ACTIVE" : "BANNED";
            
            try {
                const response = await fetch(`${API_BASE}/${jobId}/status?status=${newStatus}`, {
                    method: 'PUT'
                });

                if (response.ok) {
                    await fetchAllJobs(); // Refresh UI
                } else {
                    alert("Error updating status");
                    btn.disabled = false;
                }
            } catch (err) {
                alert("Network Error");
                btn.disabled = false;
            }
        }

        window.onload = fetchAllJobs;
    </script>
</body>
</html>
