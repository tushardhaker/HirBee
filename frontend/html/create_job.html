<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post a New Job | Local-Lance</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-lavender: #F6EEFF;
            --primary-purple: #8C4EC9;
            --secondary-lilac: #DFC6F9;
            --accent-orchid: #B979F7;
            --text-dark: #2D1B41;
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: var(--bg-lavender); 
            color: var(--text-dark);
        }

        .card { 
            border: none; 
            border-radius: 28px; 
            box-shadow: 0 15px 35px rgba(140, 78, 201, 0.1); 
        }

        .text-primary { color: var(--primary-purple) !important; }

        .form-control:focus, .form-select:focus {
            border-color: var(--primary-purple);
            box-shadow: 0 0 0 0.25rem rgba(140, 78, 201, 0.15);
        }

        .form-switch .form-check-input { 
            width: 3em; 
            height: 1.5em; 
            cursor: pointer; 
        }
        
        .form-switch .form-check-input:checked {
            background-color: var(--primary-purple);
            border-color: var(--primary-purple);
        }

        .location-badge { 
            background: var(--bg-lavender); 
            color: var(--primary-purple); 
            padding: 8px 18px; 
            border-radius: 20px; 
            font-size: 0.85rem; 
            font-weight: 700;
            border: 1px dashed var(--primary-purple);
        }

        .btn-primary { 
            background: linear-gradient(45deg, var(--primary-purple), var(--accent-orchid)); 
            border: none; 
            transition: all 0.3s ease;
        }

        .btn-primary:hover { 
            opacity: 0.9; 
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(140, 78, 201, 0.3);
        }

        .back-link {
            color: var(--text-dark);
            font-weight: 600;
            transition: 0.3s;
            text-decoration: none;
        }

        .back-link:hover {
            color: var(--primary-purple);
        }

        .visibility-box {
            background-color: #fff;
            border: 2px solid var(--secondary-lilac);
        }

        #toast-container { 
            position: fixed; 
            top: 20px; 
            right: 20px; 
            z-index: 9999; 
        }

        .custom-toast {
            min-width: 300px; 
            padding: 16px; 
            margin-bottom: 10px; 
            border-radius: 16px;
            background: white; 
            box-shadow: 0 10px 25px rgba(140, 78, 201, 0.2);
            display: flex; 
            align-items: center; 
            gap: 12px;
            animation: slideIn 0.3s ease-out; 
            border-left: 6px solid var(--primary-purple);
        }

        @keyframes slideIn { 
            from { transform: translateX(100%); opacity: 0; } 
            to { transform: translateX(0); opacity: 1; } 
        }

        .toast-success { border-left-color: #22c55e; }
        .toast-error { border-left-color: #ef4444; }

        .toast-fade-out { 
            animation: slideOut 0.3s ease-in forwards; 
        }

        @keyframes slideOut { 
            to { transform: translateX(100%); opacity: 0; } 
        }
    </style>
</head>
<body>

    <div id="toast-container"></div>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="mb-4">
                    <a href="client-dashboard.html" class="back-link">
                        <i class="bi bi-arrow-left-circle-fill me-2"></i>Back to Dashboard
                    </a>
                </div>
                
                <div class="card p-4 p-md-5 bg-white">
                    <div class="text-center mb-4">
                        <div class="bg-lavender d-inline-block p-3 rounded-circle mb-3">
                            <i class="bi bi-briefcase-fill text-primary fs-3"></i>
                        </div>
                        <h3 class="fw-bold mb-1 text-primary">Post a New Job</h3>
                        <p class="text-muted small">Reach the best local or global talent instantly</p>
                    </div>

                    <form id="createJobForm">
                        <div class="mb-3">
                            <label class="form-label fw-bold small">Job Title</label>
                            <input type="text" id="jobTitle" class="form-control rounded-4" placeholder="e.g. Website Developer, Plumber..." required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold small">Job Description</label>
                            <textarea id="jobDetails" class="form-control rounded-4" rows="4" placeholder="Briefly explain the work requirements..." required></textarea>
                        </div>

                        <div class="mb-3">
    <label class="form-label fw-bold small">Category</label>
    <select id="jobCategory" class="form-select rounded-4" required>
        <option value="" selected disabled>Select a Category</option>
        
        <optgroup label="Technology & Development">
            <option value="Web Development">Web Development</option>
            <option value="Mobile App Development">Mobile App Development</option>
            <option value="Software Engineering">Software Engineering</option>
            <option value="Data Science & Analytics">Data Science & Analytics</option>
            <option value="Cybersecurity">Cybersecurity</option>
            <option value="Game Development">Game Development</option>
            <option value="IT Support & Networking">IT Support & Networking</option>
        </optgroup>

        <optgroup label="Creative & Design">
            <option value="Graphic Design">Graphic Design</option>
            <option value="UI/UX Design">UI/UX Design</option>
            <option value="Video Editing & Animation">Video Editing & Animation</option>
            <option value="Logo & Brand Identity">Logo & Brand Identity</option>
            <option value="Photography">Photography</option>
            <option value="Interior Design">Interior Design</option>
            <option value="Fashion Design">Fashion Design</option>
        </optgroup>

        <optgroup label="Writing & Translation">
            <option value="Content Writing">Content Writing</option>
            <option value="Copywriting">Copywriting</option>
            <option value="Technical Writing">Technical Writing</option>
            <option value="Proofreading & Editing">Proofreading & Editing</option>
            <option value="Translation Services">Translation Services</option>
        </optgroup>

        <optgroup label="Marketing & Business">
            <option value="Digital Marketing">Digital Marketing</option>
            <option value="Social Media Management">Social Media Management</option>
            <option value="SEO Optimization">SEO Optimization</option>
            <option value="Sales & Lead Generation">Sales & Lead Generation</option>
            <option value="Business Consulting">Business Consulting</option>
            <option value="Project Management">Project Management</option>
        </optgroup>

        <optgroup label="Education & Professional Services">
            <option value="Education">Education / Tutoring</option>
            <option value="Legal Consulting">Legal Consulting</option>
            <option value="Financial Accounting">Financial Accounting & Bookkeeping</option>
            <option value="Virtual Assistant">Virtual Assistant</option>
            <option value="Data Entry">Data Entry</option>
        </optgroup>

        <optgroup label="Local & Home Services">
            <option value="Home Services">Home Services (Plumbing/Electric)</option>
            <option value="Carpentry">Carpentry</option>
            <option value="Cleaning Services">Cleaning Services</option>
            <option value="Event Planning">Event Planning & Management</option>
            <option value="Fitness & Personal Training">Fitness & Personal Training</option>
            <option value="Delivery Services">Delivery Services</option>
        </optgroup>

        <optgroup label="Other">
            <option value="Other">Other</option>
        </optgroup>
    </select>
</div>

                        <div class="mb-3">
                            <label class="form-label fw-bold small">Budget (INR)</label>
                            <div class="input-group">
                                <span class="input-group-text bg-lavender border-end-0 rounded-start-4 text-primary fw-bold">₹</span>
                                <input type="number" id="budget" class="form-control rounded-end-4 border-start-0" placeholder="0.00" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold small">Work Mode</label>
                            <select id="workMode" class="form-select rounded-4" required>
                                <option value="OFFLINE">Offline (On-Site)</option>
                                <option value="ONLINE">Online (Remote)</option>
                            </select>
                        </div>

                        <div class="p-3 rounded-4 mb-4 visibility-box">
                            <div class="d-flex justify-content-between align-items-center">
                                <div>
                                    <h6 class="fw-bold mb-0">Local Visibility Only</h6>
                                    <p class="text-muted extra-small mb-0" style="font-size: 0.75rem;">Limit view to freelancers in your city.</p>
                                </div>
                                <div class="form-check form-switch">
                                    <input class="form-check-input" type="checkbox" id="locationToggle">
                                </div>
                            </div>
                            <div id="locationDisplay" class="mt-3 d-none">
                                <span class="location-badge" id="currentCityBadge">
                                    <i class="bi bi-geo-alt-fill me-1"></i> Detected City
                                </span>
                            </div>
                        </div>

                        <button type="submit" id="submitBtn" class="btn btn-primary w-100 rounded-pill py-3 fw-bold shadow-sm">
                            <span id="btnLabel"><i class="bi bi-rocket-takeoff me-2"></i>Post Job Now</span>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="/script/create_job.js"></script>
</body>
</html>
